  response_fields:
  - {name: AccessToken, type: string, description: Token used for accessing protected routes.}
  - {name: IdToken, type: string, description: JWT carrying user identity; this is the value the provider's own examples put in the authorization header.}
  - {name: RefreshToken, type: string, description: Token used to obtain new access tokens.}
