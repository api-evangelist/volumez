  - name: Tenant Token (JWT Access Token)
    use: Used by a Volumez Connector; identifies the tenant. Also the `tenant_token` Terraform input.
  - name: Tenant Host Token / Refresh Token (JWT Refresh Token)
    use: Used by a Volumez Connector; identifies the tenant's host.
  - name: CSI Driver Token (Refresh Token)
    use: Passed to the Kubernetes CSI driver as helm value `vlzAuthToken`. Documented to expire in 10 years.
