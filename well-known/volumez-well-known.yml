source: live /.well-known/ probes across every host this record knows, 2026-09-04
summary: >-
  Volumez serves NO /.well-known/ document on any host it controls. The apex and www sites (Webflow)
  answer 404 with a Webflow "Invalid .well-known request" body on every path. The two API hosts the
  provider names — api.volumez.com (production, named throughout its own documentation) and
  api.dev.volumez.com (the servers[] value in its own OpenAPI) — no longer resolve in DNS at all.
  The documentation host docs.volumez.com resolves to Document360 behind Cloudflare but has no valid
  TLS certificate for the custom hostname (immediate handshake_failure, HTTP/1.1 409 "error code:
  1001" on port 80), so nothing can be probed there by anyone.
pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer are emitted. Every path is a 404, an NXDOMAIN, or
  an unreachable host. This file records a measured absence, not a served surface.
false_positive_watch: >-
  https://volumez.statuspage.io/.well-known/security.txt returns HTTP 200 with a real, PGP-signed
  RFC 9116 document — but it is ATLASSIAN's, not Volumez's: Contact security@atlassian.com,
  Canonical https://www.atlassian.com/.well-known/security.txt. volumez.statuspage.io is a
  vendor-operated Atlassian Statuspage host on the statuspage.io domain, so that document says
  nothing about Volumez's own vulnerability-disclosure posture. It is recorded below as a miss.
  Any future round that credits Volumez with a security.txt on the strength of that 200 is wrong.
