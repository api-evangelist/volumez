apis:
- name: Volumez Orchestrator API
  description: REST API for the Volumez orchestrator — create and modify volumes from declarative policies, plan
    and auto-provision infrastructure, manage media and nodes, take and roll back snapshots, attach volumes to nodes,
    publish NFS/exports, configure networks and connectivities, watch asynchronous jobs and alerts, and administer
    tenants, users, roles and cloud-provider credentials. 124 operations over 95 paths, described by a first-party
    OpenAPI 3.0.1 document Volumez publishes inside its generated Go client. Authenticated with a JWT bearer token
    in the `authorization` header, backed by an AWS Cognito user pool.
