aid: volumez
name: Volumez
description: Volumez is a SaaS data-infrastructure-as-a-service (DIaaS) company, founded in 2020, headquartered
  in the San Francisco Bay Area with R&D in Tel Aviv, that composes block and file storage directly out of cloud
  instance-local NVMe media instead of a storage controller. Its orchestrator exposes a declarative REST API — volumes,
  policies, media, nodes, networks, snapshots, attachments, exports, connectivities, capacity groups, jobs and tenant/user
  administration — so applications can request precise IO characteristics (IOPS, latency, resiliency) the same way
  they request CPU and memory. The platform ships a Kubernetes CSI driver (Helm chart), Terraform and Bicep infrastructure
  modules for AWS, Azure and OCI, and a generated Go REST client. Through 2026 the company repositioned its public
  site around enterprise agentic-AI infrastructure and retired its public developer portal, API host and status
  page; the machine-readable contract now lives only in its own GitHub organization.
