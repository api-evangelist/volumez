      properties:
        message:
          type: string
          x-omitempty: false
          x-isnullable: false
      type: object
    ConnectivityCheck:
      example:
        targets_selector: targets_selector
        initiators_selector: initiators_selector
      properties:
        initiators_selector:
          minLength: 1
          type: string
        targets_selector:
          minLength: 1
