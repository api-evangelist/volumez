        name:
          type: string
        zones1:
          type: string
        systemtypes1:
          pattern: ^(?:(?:rhel|sles|amzn|ubuntu)[, ])*(?:rhel|sles|amzn|ubuntu)$
          type: string
        zones2:
          type: string
        systemtypes2:
          pattern: ^(?:(?:rhel|sles|amzn|ubuntu)[, ])*(?:rhel|sles|amzn|ubuntu)$
          type: string
        mediaprotocol:
          type: string
        replicationprotocol:
          type: string
        replicationbandwidth:
          minimum: 0
          type: integer
      required:
      - mediaprotocol
      - name
      - replicationprotocol
      - systemtypes1
      - systemtypes2
      - zones1
      - zones2
      type: object
    ErrorResponse:
      example:
