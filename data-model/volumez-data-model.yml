core_flow: >-
  Node registers (connector) -> NodeHwScan discovers Media -> MediaAssign puts media under Volumez
  control -> a Policy declares the desired outcome -> PolicyPlan / BatchVolumesPlan rehearses the
  placement -> VolumeCreate composes a Volume out of assigned Media across zones -> AttachmentCreate
  binds it to a Node (or ExportCreate publishes it) -> SnapshotCreate protects it -> SnapshotRollback
  reverses it. Every step past the plan returns a Job to poll.
