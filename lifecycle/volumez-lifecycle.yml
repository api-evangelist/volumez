deprecation:
  policy_documented: false
  sunset_headers: false
  deprecated_operations: []
  notes: >-
    No deprecation or sunset policy is published, no operation in the 124-operation contract carries
    `deprecated: true`, and no Deprecation/Sunset (RFC 8594) header is declared. The API was not
    deprecated — its hosts were simply withdrawn from DNS, with no notice surface left standing.
    NO Deprecation pointer is emitted.
sla:
  documented: false
  notes: >-
    No SLA or uptime commitment is published. The Policies resource lets a customer declare per-volume
    outcome targets (iopsread/iopswrite, bandwidth, latencyread/latencywrite, failureperformance,
    resiliencymedia/node/zone) — that is a workload guarantee expressed in the contract, not a service
    availability SLA.
