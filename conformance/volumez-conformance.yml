domain_standards_note: >-
  Block/file storage-as-a-service has no contract-level interoperability standard the way SCIM,
  OData, FHIR or OpenRTB do for their markets, and Volumez declares none in its OpenAPI. Its real
  domain-standard surface is CSI (above), delivered as a Kubernetes driver rather than as a shape in
  the REST document. Recorded honestly rather than left blank or invented.
