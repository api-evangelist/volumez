- id: aws-api-gateway
  conforms: true
  evidence: >-
    The contract carries AWS API Gateway vendor extensions — x-amazon-apigateway-authtype
    cognito_user_pools and x-amazon-apigateway-authorizer with a us-east-1 Cognito user-pool ARN —
    and 94 OPTIONS mock-integration preflight operations. The API is an API Gateway deployment.
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 or openIdConnect securityScheme is declared. Authentication is an opaque JWT in the
    `authorization` header, minted by POST /signin against an AWS Cognito user pool. Cognito speaks
    OIDC upstream, but Volumez publishes no authorization-server metadata, no discovery document and
    no scopes, so there is nothing an OAuth client can negotiate against.
